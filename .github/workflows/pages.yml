name: Publish catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.59.0'
      - run: just docs
      - name: Overlay independently built PR preview snapshots
        run: |
          if git ls-remote --exit-code origin refs/heads/pr-preview-cache >/dev/null 2>&1; then
            git fetch -q --depth=1 origin refs/heads/pr-preview-cache
            mkdir -p "$RUNNER_TEMP/charmed-preview-cache"
            git archive FETCH_HEAD | tar -xf - -C "$RUNNER_TEMP/charmed-preview-cache"
            if test -d "$RUNNER_TEMP/charmed-preview-cache/pr-preview"; then
              cp -a "$RUNNER_TEMP/charmed-preview-cache/pr-preview" docs/dist/
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
