name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Static guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/workbench generate --out docs
      - run: python3 scripts/test_preview_pr.py
      - uses: actions/upload-artifact@v4
        with:
          name: static-guide
          path: docs/dist
          retention-days: 7
