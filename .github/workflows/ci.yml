name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Static guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/workbench generate --out docs
      - run: python3 scripts/test_preview_pr.py
      - uses: actions/upload-artifact@v4
        with:
          name: static-guide
          path: docs/dist
          retention-days: 7

  mobile:
    name: Responsive guide
    needs: catalog
    # Keep the runner compatible with the pinned Playwright/browser release.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: static-guide
          path: docs/dist
      - name: Install browser verification tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check mobile and desktop layouts and navigation
        run: python scripts/test_mobile_guide.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-guide-evidence
          path: artifacts/mobile-guide
          retention-days: 7
          if-no-files-found: warn
