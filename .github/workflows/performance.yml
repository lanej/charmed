name: Native performance reports

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Measurement suite
        type: choice
        options: [catalog, hotspots, profiles, heap, native]
        default: catalog
      runner:
        description: Report host (timings are not merge gates)
        type: choice
        options: [ubuntu-latest, macos-latest]
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  report:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      PERF_SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Collect report
        shell: bash
        run: |
          case "$PERF_SUITE" in
            catalog) python3 scripts/perf.py --suite catalog --count 1 --benchtime 20ms ;;
            hotspots) python3 scripts/perf.py --suite hotspots ;;
            profiles) python3 scripts/perf.py --suite profiles --count 1 --benchtime 1s ;;
            heap) python3 scripts/perf.py --suite heap ;;
            native) python3 scripts/perf_native.py ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-performance-${{ inputs.runner }}-${{ inputs.suite }}
          path: .cache/perf
          retention-days: 7
